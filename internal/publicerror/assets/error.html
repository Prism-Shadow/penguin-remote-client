<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.Title}} · Penguin Remote</title>
<style>
:root{color-scheme:light dark;--background:#f8f9fa;--surface:#fff;--text:#202124;--muted:#5f6368;--line:#dadce0;--accent:#1a73e8;--on-accent:#fff;--shadow:0 1px 2px rgba(60,64,67,.08)}
@media(prefers-color-scheme:dark){:root{--background:#17181b;--surface:#202124;--text:#e8eaed;--muted:#bdc1c6;--line:#383a3f;--accent:#a8c7fa;--on-accent:#202124;--shadow:0 10px 24px rgba(0,0,0,.18)}}
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--text);font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
main{min-height:100vh;min-height:100svh;display:grid;align-content:center;padding:24px}.shell{width:min(100%,660px);margin:auto;display:grid;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800;letter-spacing:-.5px}.brand img{width:38px;height:38px;border-radius:10px}.badge{padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.card{padding:36px 28px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}.status-icon{width:32px;height:32px;color:var(--accent);margin-bottom:2px}h1{margin:0;font-size:20px;line-height:1.4;font-weight:700}p{margin:0;max-width:470px;font-size:14px;line-height:1.7;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px}a{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:9px 18px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none}.primary{background:var(--accent);color:var(--on-accent);border:1px solid transparent}.secondary{color:var(--text);border:1px solid var(--line)}a:hover{filter:brightness(.96)}a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}a svg{width:16px;height:16px}footer{text-align:center;font-size:12px;color:var(--muted)}
@media(max-width:600px){main{padding:16px}.shell{gap:14px}.brand{font-size:22px}.brand img{width:32px;height:32px}.card{padding:28px 22px;border-radius:10px}h1{font-size:18px}.actions{width:100%;flex-direction:column}.actions a{width:100%}}
</style>
</head>
<body>
<main><div class="shell">
<header><div class="brand"><img src="{{.Logo}}" alt="" aria-hidden="true"><span>Penguin Remote</span></div><span class="badge">{{.Badge}}</span></header>
<section class="card" aria-labelledby="error-title" aria-describedby="error-detail">
<svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4h.01"/></svg>
<h1 id="error-title">{{.Title}}</h1><p id="error-detail">{{.Detail}}</p>
<div class="actions"><a class="primary" href="{{.ActionURL}}">{{.Action}}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></a>{{if ne .ActionURL .RetryURL}}<a class="secondary" href="{{.RetryURL}}">{{.Retry}}</a>{{end}}</div>
</section><footer>Penguin Remote</footer>
</div></main>
</body></html>

name: Desktop build and release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      require_windows_signing:
        description: Sign Windows artifacts with EVSign; fail if credentials are missing.
        type: boolean
        default: false
      require_macos_signing:
        description: Sign and notarize macOS artifacts; fail if credentials are missing.
        type: boolean
        default: false
      windows_only:
        description: Build only Windows for a manual signing rehearsal; tags always build all platforms.
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - "desktop-v*"

permissions:
  contents: read

env:
  REQUIRE_WINDOWS_SIGNING: ${{ (startsWith(github.ref, 'refs/tags/desktop-v') || inputs.require_windows_signing) && 'true' || 'false' }}
  REQUIRE_MACOS_SIGNING: ${{ (startsWith(github.ref, 'refs/tags/desktop-v') || inputs.require_macos_signing) && 'true' || 'false' }}

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      penguin_go_url: ${{ steps.version.outputs.penguin_go_url }}
      release_channel: ${{ steps.version.outputs.release_channel }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate release version
        id: version
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import { releaseTarget } from "./scripts/release-target.mjs";
            const version = JSON.parse(fs.readFileSync("desktop/package.json", "utf8")).version;
            const target = releaseTarget(version);
            if (process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== "desktop-v" + version) throw new Error("Tag/package version mismatch");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "version=" + version + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "penguin_go_url=" + target.penguinGoUrl + "\nrelease_channel=" + target.channel + "\n");
          '
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - run: go test -mod=readonly -buildvcs=false ./...
      - name: Go lifecycle race tests
        run: go test -race -mod=readonly -buildvcs=false ./cmd/penguin-remote
        env:
          CGO_ENABLED: "1"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - run: pnpm --dir desktop install --frozen-lockfile
      - run: pnpm --dir desktop typecheck
      - run: pnpm --dir desktop test
      - run: node desktop/scripts/check-legal.mjs

  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/desktop-v')
    needs: check
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            github.event_name == 'workflow_dispatch' && inputs.windows_only &&
            '[{"os":"windows-latest","command":"pack:win","artifact":"windows-x64","environment":"desktop-build","platform":"win","arch":"x64"}]' ||
            '[{"os":"windows-latest","command":"pack:win","artifact":"windows-x64","environment":"desktop-build","platform":"win","arch":"x64"},
              {"os":"macos-15-intel","command":"pack:mac:x64","artifact":"macos-x64","environment":"apple-signing","platform":"mac","arch":"x64"},
              {"os":"macos-15","command":"pack:mac:arm64","artifact":"macos-arm64","environment":"apple-signing","platform":"mac","arch":"arm64"},
              {"os":"ubuntu-22.04","command":"pack:linux","artifact":"linux-x64","environment":"desktop-build","platform":"linux","arch":"x64"}]'
          ) }}
    runs-on: ${{ matrix.os }}
    env:
      PENGUIN_REMOTE_GO_URL: ${{ needs.check.outputs.penguin_go_url }}
    environment:
      name: ${{ matrix.environment }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Prepare Windows signing credentials
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EVSIGN_KEY: ${{ secrets.EVSIGN_KEY }}
        run: ./scripts/prepare-windows-signing.ps1
      - name: Prepare macOS signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/prepare-macos-signing.sh
      - run: pnpm ${{ matrix.command }}
        env:
          EVSIGN_KEY: ${{ runner.os == 'Windows' && env.REQUIRE_WINDOWS_SIGNING == 'true' && secrets.EVSIGN_KEY || '' }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: Verify Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-signing.ps1
      - name: Verify macOS signatures and notarize DMG
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/verify-macos-signing.sh "${{ matrix.arch }}"
      - name: Remove temporary Apple API key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f "$RUNNER_TEMP/penguin-remote-signing/"AuthKey_*.p8
      - uses: actions/upload-artifact@v4
        with:
          name: penguin-remote-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/desktop/penguin-remote-*
            dist/desktop/signing-*.json

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [check, package]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v5
        with:
          pattern: penguin-remote-*
          merge-multiple: true
          path: release-assets
      - name: Prepare complete release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/prepare-release.mjs --dir release-assets --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
      - name: Upload and publish signed prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
          RELEASE_GO_URL: ${{ needs.check.outputs.penguin_go_url }}
          RELEASE_CHANNEL: ${{ needs.check.outputs.release_channel }}
        run: |
          RELEASE_TITLE="Penguin Remote $RELEASE_VERSION"
          if [ "$RELEASE_CHANNEL" = staging ]; then
            RELEASE_TITLE="$RELEASE_TITLE (Staging Test)"
            TARGET_NOTE="STAGING TEST ONLY. Penguin Go endpoint: $RELEASE_GO_URL. Not for production use."
          else
            TARGET_NOTE="Production Penguin Go endpoint: $RELEASE_GO_URL. Remote subscription and compatible server deployment are required."
          fi
          printf '%s\n' \
            'Windows artifacts are Authenticode signed; macOS apps are Developer ID signed and notarized, with stapled DMGs.' \
            "$TARGET_NOTE" \
            'Legacy credentials require a fresh sign-in. SHA256SUMS.txt and release-manifest.json identify the uploaded files and source commit.' \
            > release-notes.txt
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > existing-release.json 2>/dev/null; then
            node --input-type=module -e '
              import fs from "node:fs";
              const release = JSON.parse(fs.readFileSync("existing-release.json", "utf8"));
              if (!release.isDraft || release.targetCommitish !== process.env.GITHUB_SHA) throw new Error("Never overwrite a published or different-source release");
            '
          else
            gh release create "$RELEASE_TAG" --verify-tag --target "$GITHUB_SHA" --draft --prerelease --latest=false \
              --title "$RELEASE_TITLE" --notes-file release-notes.txt
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          RELEASE_API_URL="$(gh release view "$RELEASE_TAG" --json apiUrl --jq '.apiUrl')"
          gh api "$RELEASE_API_URL" > uploaded-release.json
          node scripts/verify-uploaded-release.mjs release-assets uploaded-release.json
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false

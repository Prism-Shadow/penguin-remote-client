appId: com.prismshadow.penguinremote
productName: Penguin Remote
directories:
  output: ../dist/desktop
  buildResources: build
files:
  - dist/**/*
  - package.json
extraResources:
  - from: native
    to: bin
    filter:
      - "**/*"
  - from: build/icon.png
    to: icon.png
  - from: build/window-icon.ico
    to: window-icon.ico
  - from: ../LICENSE
    to: legal/LICENSE
  - from: ../NOTICE
    to: legal/NOTICE
  - from: ../THIRD_PARTY_NOTICES.md
    to: legal/THIRD_PARTY_NOTICES.md
  - from: ../third_party/licenses
    to: legal/third_party/licenses
  - from: ../third_party/frp/LICENSE
    to: legal/third_party/frp/LICENSE
  - from: ../third_party/frp/REMOTE_CHANGES.md
    to: legal/third_party/frp/REMOTE_CHANGES.md
asar: true
npmRebuild: false
nodeGypRebuild: false
afterPack: build/after-pack.cjs
afterSign: build/after-sign.cjs

win:
  icon: build/icon.png
  artifactName: penguin-remote-win-${arch}.${ext}
  # The Go executable is signed before packaging and copied byte-for-byte.
  signExts:
    - Penguin Remote.exe
    - elevate.exe
    - penguin-remote-win-x64.exe
    - .__uninstaller.exe
    - "!.exe"
  signtoolOptions:
    sign: build/evsign.cjs
    signingHashAlgorithms:
      - sha256
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  icon: build/icon-mac.png
  category: public.app-category.utilities
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true
  artifactName: penguin-remote-mac-${arch}.${ext}
  target:
    - dmg
    - zip

linux:
  icon: build/icons
  category: Utility
  executableName: penguin-remote
  artifactName: penguin-remote-linux-${arch}.${ext}
  target:
    - AppImage
    - deb

deb:
  maintainer: Prism Shadow
